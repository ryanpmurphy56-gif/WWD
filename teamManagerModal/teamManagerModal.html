<template>
    <div class="backdrop" onclick={handleBackdrop}>
        <div class="dialog" onclick={stop} role="dialog" aria-label="Manage team members">
            <template lwc:if={isEditing}>
                <div class="dialog__head">
                    <span class="dialog__title">{formTitle}</span>
                    <button type="button" class="dialog__close" title="Close" onclick={close}>✕</button>
                </div>
                <div class="dialog__body">
                    <template lwc:if={errorText}>
                        <p class="dialog__error">{errorText}</p>
                    </template>
                    <div class="field">
                        <label class="field__label">Name</label>
                        <input class="field__input" type="text" value={draft.name} onchange={handleNameChange} />
                    </div>
                    <div class="field">
                        <label class="field__label">Role</label>
                        <input class="field__input" type="text" value={draft.role} onchange={handleRoleChange} />
                    </div>
                    <div class="field">
                        <label class="field__label">Photo</label>
                        <c-image-uploader
                            site-id={siteId}
                            image-url={draft.photoUrl}
                            label="Upload photo"
                            onuploaded={handlePhotoUploaded}
                            onremove={handlePhotoRemove}
                        ></c-image-uploader>
                    </div>
                    <div class="field">
                        <label class="field__label">Bio</label>
                        <textarea class="field__input" rows="5" onchange={handleBioChange}>{draft.bio}</textarea>
                    </div>
                    <div class="field">
                        <label class="field__label">LinkedIn URL</label>
                        <input class="field__input" type="text" placeholder="https://linkedin.com/in/..." value={draft.linkedinUrl} onchange={handleLinkedinChange} />
                    </div>
                    <div class="field field_row">
                        <label class="field__check">
                            <input type="checkbox" checked={draft.isActive} onchange={handleActiveChange} />
                            Active (visible in the Team section)
                        </label>
                    </div>
                </div>
                <div class="dialog__foot">
                    <button type="button" class="btn" onclick={handleCancelEdit}>Cancel</button>
                    <button type="button" class="btn btn_primary" disabled={saveDisabled} onclick={handleSaveDraft}>{saveLabel}</button>
                </div>
            </template>

            <template lwc:else>
                <div class="dialog__head">
                    <span class="dialog__title">Team members</span>
                    <button type="button" class="dialog__close" title="Close" onclick={close}>✕</button>
                </div>
                <div class="dialog__body">
                    <template lwc:if={loading}>
                        <p class="dialog__lead">Loading…</p>
                    </template>
                    <template lwc:elseif={errorText}>
                        <p class="dialog__error">{errorText}</p>
                    </template>
                    <template lwc:elseif={hasMembers}>
                        <ul class="posts">
                            <template for:each={members} for:item="m">
                                <li key={m.id} class="post">
                                    <div class="post__info">
                                        <span class="post__title">{m.name}</span>
                                        <span class="post__status">{m.statusLabel}</span>
                                    </div>
                                    <div class="post__actions">
                                        <button type="button" class="btn" data-id={m.id} onclick={handleEditMember}>Edit</button>
                                        <button type="button" class="btn btn_danger" data-id={m.id} onclick={handleDeleteMember}>Delete</button>
                                    </div>
                                </li>
                            </template>
                        </ul>
                    </template>
                    <template lwc:else>
                        <p class="dialog__lead">No team members yet.</p>
                    </template>
                </div>
                <div class="dialog__foot">
                    <button type="button" class="btn" onclick={close}>Close</button>
                    <button type="button" class="btn btn_primary" onclick={handleNewMember}>+ New team member</button>
                </div>
            </template>
        </div>
    </div>
</template>
