<template>
    <section class={rootClass} style={rootStyle}>
        <div class="sec__grid">
            <div class="sec__block imgtext" style={blockStyle}>
                <div class="imgtext__media">
                    <template lwc:if={hasImage}>
                        <img class="imgtext__img" src={imageUrl} alt={imageAlt} style={imgStyle} />
                    </template>
                    <template lwc:else>🖼</template>
                </div>
                <div class="imgtext__body">
                    <h3
                        class="imgtext__heading"
                        style={headingFieldStyle}
                        contenteditable={editableAttr}
                        data-field="heading"
                        data-placeholder="Add a heading"
                        onblur={handleEdit}
                        onkeydown={handleKeydown}
                    >{heading}</h3>
                    <p
                        class="imgtext__text"
                        style={bodyFieldStyle}
                        contenteditable={editableAttr}
                        data-field="body"
                        data-placeholder="Add some text"
                        onblur={handleEdit}
                    >{body}</p>
                </div>
            </div>
        </div>
    </section>
</template>
