<template>
    <div class="focal" onclick={handleClick} title="Click to set the focal point">
        <img class="focal__img" src={imageUrl} alt="Focal point preview" />
        <span class="focal__dot" style={dotStyle}></span>
    </div>
    <p class="focal__hint">Click the image to set its focal point — the spot that stays in frame when the image is cropped.</p>
</template>
