<template>
    <section class="ws-sect">
        <div class="shell">
            <div class="ws-sec-head">
                <div class="mono eyebrow">{eyebrow}</div>
                <h2 class="ws-sec">{heading}</h2>
            </div>
            <div class="ws-re-grid">
                <template for:each={items} for:item="item">
                    <div key={item.title} class="ws-re">
                        <h4>{item.title}</h4>
                        <p>{item.copy}</p>
                    </div>
                </template>
            </div>
        </div>
    </section>
</template>
