<template>
    <div class="popup-backdrop" onclick={handleClose}></div>
    <div class="cart-popup">
        <div class="popup-header">
            <div class="popup-title"><span>Cart</span></div>
            <button class="close-btn" onclick={handleClose}>✕</button>
        </div>
        <div class="popup-body">
            <template if:true={hasItems}>
                <div class="cart-item-list">
                    <template for:each={enrichedItems} for:item="item">
                        <div key={item.Id} class="popup-item">
                            <div class="popup-item-img">
                                <img if:true={item.ProductImage} src={item.ProductImage} alt={item.ProductName} />
                            </div>
                            <div class="popup-item-info">
                                <p class="popup-item-name">{item.ProductName}</p>
                                <p class="popup-item-qty">Qty: {item._displayQty}</p>
                            </div>
                            <div class="popup-item-price">{item._formattedTotal}</div>
                        </div>
                    </template>
                </div>
            </template>
            <template if:false={hasItems}>
                <div class="empty-cart">Your cart is empty.</div>
            </template>
        </div>
        <div class="popup-footer">
            <div class="popup-total-row">
                <span class="popup-total-label">Cart Total ({cartCount} items)</span>
                <span class="popup-total-value">{cartTotal}</span>
            </div>
            <button class="view-cart-btn" onclick={handleViewCart} disabled={isCheckoutDisabled}>
                View Cart &amp; Checkout
            </button>
            <button class="keep-shopping-btn" onclick={handleClose}>Continue Shopping</button>
            <template if:true={hasItems}>
                <template if:false={confirmingClear}>
                    <button class="clear-cart-btn" onclick={handleClearCartClick}>
                        <span class="clear-cart-icon">🗑</span> Clear cart
                    </button>
                </template>
                <template if:true={confirmingClear}>
                    <div class="clear-confirm">
                        <span class="clear-confirm-text">Remove all items?</span>
                        <div class="clear-confirm-actions">
                            <button class="clear-confirm-yes" onclick={handleClearCartConfirm}>Yes, remove all</button>
                            <button class="clear-confirm-no" onclick={handleClearCartKeep}>Keep items</button>
                        </div>
                    </div>
                </template>
            </template>
        </div>
    </div>
</template>
