<template>
    <div class="backdrop" onclick={handleBackdrop}>
        <div class="dialog" onclick={stop} role="dialog" aria-label="Manage blog posts">
            <template lwc:if={isEditing}>
                <div class="dialog__head">
                    <span class="dialog__title">{formTitle}</span>
                    <button type="button" class="dialog__close" title="Close" onclick={close}>✕</button>
                </div>
                <div class="dialog__body">
                    <template lwc:if={errorText}>
                        <p class="dialog__error">{errorText}</p>
                    </template>
                    <div class="field">
                        <label class="field__label">Title</label>
                        <input class="field__input" type="text" value={draft.title} onchange={handleTitleChange} />
                    </div>
                    <div class="field">
                        <label class="field__label">Slug</label>
                        <input class="field__input" type="text" value={draft.slug} onchange={handleSlugChange} />
                    </div>
                    <div class="field">
                        <label class="field__label">Excerpt</label>
                        <textarea class="field__input" rows="2" onchange={handleExcerptChange}>{draft.excerpt}</textarea>
                    </div>
                    <div class="field">
                        <label class="field__label">Cover image</label>
                        <c-image-uploader
                            site-id={siteId}
                            image-url={draft.coverImageUrl}
                            label="Upload cover image"
                            onuploaded={handleCoverUploaded}
                            onremove={handleCoverRemove}
                        ></c-image-uploader>
                    </div>
                    <div class="field">
                        <label class="field__label">Body</label>
                        <textarea class="field__input" rows="8" onchange={handleBodyChange}>{draft.body}</textarea>
                    </div>
                    <div class="field field_row">
                        <label class="field__check">
                            <input type="checkbox" checked={draft.isPublished} onchange={handlePublishedChange} />
                            Published
                        </label>
                    </div>
                </div>
                <div class="dialog__foot">
                    <button type="button" class="btn" onclick={handleCancelEdit}>Cancel</button>
                    <button type="button" class="btn btn_primary" disabled={saveDisabled} onclick={handleSaveDraft}>{saveLabel}</button>
                </div>
            </template>

            <template lwc:else>
                <div class="dialog__head">
                    <span class="dialog__title">Blog posts</span>
                    <button type="button" class="dialog__close" title="Close" onclick={close}>✕</button>
                </div>
                <div class="dialog__body">
                    <template lwc:if={loading}>
                        <p class="dialog__lead">Loading…</p>
                    </template>
                    <template lwc:elseif={errorText}>
                        <p class="dialog__error">{errorText}</p>
                    </template>
                    <template lwc:elseif={hasPosts}>
                        <ul class="posts">
                            <template for:each={posts} for:item="p">
                                <li key={p.id} class="post">
                                    <div class="post__info">
                                        <span class="post__title">{p.title}</span>
                                        <span class="post__status">{p.statusLabel}</span>
                                    </div>
                                    <div class="post__actions">
                                        <button type="button" class="btn" data-id={p.id} onclick={handleEditPost}>Edit</button>
                                        <button type="button" class="btn btn_danger" data-id={p.id} onclick={handleDeletePost}>Delete</button>
                                    </div>
                                </li>
                            </template>
                        </ul>
                    </template>
                    <template lwc:else>
                        <p class="dialog__lead">No posts yet.</p>
                    </template>
                </div>
                <div class="dialog__foot">
                    <button type="button" class="btn" onclick={close}>Close</button>
                    <button type="button" class="btn btn_primary" onclick={handleNewPost}>+ New post</button>
                </div>
            </template>
        </div>
    </div>
</template>
