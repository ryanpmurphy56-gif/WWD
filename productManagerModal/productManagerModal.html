<template>
    <div class="backdrop" onclick={handleBackdrop}>
        <div class="dialog" onclick={stop} role="dialog" aria-label="Manage products">
            <template lwc:if={isEditing}>
                <div class="dialog__head">
                    <span class="dialog__title">{formTitle}</span>
                    <button type="button" class="dialog__close" title="Close" onclick={close}>✕</button>
                </div>
                <div class="dialog__body">
                    <template lwc:if={errorText}>
                        <p class="dialog__error">{errorText}</p>
                    </template>
                    <div class="field">
                        <label class="field__label">Name</label>
                        <input class="field__input" type="text" value={draft.name} onchange={handleNameChange} />
                    </div>
                    <div class="field">
                        <label class="field__label">Price</label>
                        <input class="field__input" type="number" step="0.01" min="0" value={draft.price} onchange={handlePriceChange} />
                    </div>
                    <div class="field">
                        <label class="field__label">Image</label>
                        <c-image-uploader
                            site-id={siteId}
                            image-url={draft.imageUrl}
                            label="Upload product image"
                            onuploaded={handleImageUploaded}
                            onremove={handleImageRemove}
                        ></c-image-uploader>
                    </div>
                    <div class="field">
                        <label class="field__label">Description</label>
                        <textarea class="field__input" rows="4" onchange={handleDescriptionChange}>{draft.description}</textarea>
                    </div>
                    <div class="field">
                        <label class="field__label">Checkout link</label>
                        <input class="field__input" type="text" placeholder="https://checkout.square.site/..." value={draft.buyLink} onchange={handleBuyLinkChange} />
                        <p class="field__note">A Square Checkout Link for this product (Square Dashboard → Online Checkout → Checkout Links) — or a Stripe Payment Link / PayPal.me if you use those instead. Visitors can add this product to their cart, then pay for it here in a new tab.</p>
                    </div>
                    <div class="field field_row">
                        <label class="field__check">
                            <input type="checkbox" checked={draft.isActive} onchange={handleActiveChange} />
                            Active (visible in the Shop section)
                        </label>
                    </div>
                </div>
                <div class="dialog__foot">
                    <button type="button" class="btn" onclick={handleCancelEdit}>Cancel</button>
                    <button type="button" class="btn btn_primary" disabled={saveDisabled} onclick={handleSaveDraft}>{saveLabel}</button>
                </div>
            </template>

            <template lwc:else>
                <div class="dialog__head">
                    <span class="dialog__title">Products</span>
                    <button type="button" class="dialog__close" title="Close" onclick={close}>✕</button>
                </div>
                <div class="dialog__body">
                    <template lwc:if={loading}>
                        <p class="dialog__lead">Loading…</p>
                    </template>
                    <template lwc:elseif={errorText}>
                        <p class="dialog__error">{errorText}</p>
                    </template>
                    <template lwc:elseif={hasProducts}>
                        <ul class="posts">
                            <template for:each={products} for:item="p">
                                <li key={p.id} class="post">
                                    <div class="post__info">
                                        <span class="post__title">{p.name}</span>
                                        <span class="post__status">{p.statusLabel}</span>
                                    </div>
                                    <div class="post__actions">
                                        <button type="button" class="btn" data-id={p.id} onclick={handleEditProduct}>Edit</button>
                                        <button type="button" class="btn btn_danger" data-id={p.id} onclick={handleDeleteProduct}>Delete</button>
                                    </div>
                                </li>
                            </template>
                        </ul>
                    </template>
                    <template lwc:else>
                        <p class="dialog__lead">No products yet.</p>
                    </template>
                </div>
                <div class="dialog__foot">
                    <button type="button" class="btn" onclick={close}>Close</button>
                    <button type="button" class="btn btn_primary" onclick={handleNewProduct}>+ New product</button>
                </div>
            </template>
        </div>
    </div>
</template>
