<template>
    <div class="page-shell">
        <div class="auth-card">
            <div class="title-wrap">
                <h1>POINT &amp; POUR</h1>
                <p>Member Login &amp; Registration</p>
            </div>

            <div class="tab-row">
                <button class={signInTabClass} onclick={showSignIn} type="button">Sign In</button>
                <button class={createTabClass} onclick={showCreateAccount} type="button">Create Account</button>
            </div>

            <template if:true={errorMessage}>
                <div class="message-box error-box">{errorMessage}</div>
            </template>

            <template if:true={successMessage}>
                <div class="message-box success-box">{successMessage}</div>
            </template>

            <template if:true={isSignInMode}>
                <div class="form-section">
                    <div class="field-block">
                        <label>Email Address</label>
                        <input type="email" value={loginEmail} oninput={handleLoginEmailChange}/>
                    </div>

                    <div class="field-block">
                        <label>Password</label>
                        <input type="password" value={loginPassword} oninput={handleLoginPasswordChange}/>
                    </div>

                    <button class="primary-btn" onclick={handleLogin} disabled={isLoading}>
                        <template if:true={isLoading}>Signing In...</template>
                        <template if:false={isLoading}>Sign In</template>
                    </button>

                    <div class="auth-links">
                        <a href="/ForgotPassword" class="text-link">Forgot your password?</a>
                    </div>

                    <div class="switch-text">
                        Need an account?
                        <button type="button" class="inline-link" onclick={showCreateAccount}>Create one here</button>
                    </div>
                </div>
            </template>

            <template if:false={isSignInMode}>
                <template if:false={registrationComplete}>
                    <div class="form-section">
                        <p class="form-help">
                            Enter your details below and choose a password — you'll be signed in right away.
                        </p>

                        <div class="two-col">
                            <div class="field-block">
                                <label>First Name</label>
                                <input type="text" value={firstName} oninput={handleFirstNameChange}/>
                            </div>

                            <div class="field-block">
                                <label>Last Name</label>
                                <input type="text" value={lastName} oninput={handleLastNameChange}/>
                            </div>
                        </div>

                        <div class="field-block">
                            <label>Email Address</label>
                            <input type="email" value={registerEmail} oninput={handleRegisterEmailChange}/>
                        </div>

                        <div class="field-block">
                            <label>Date of Birth</label>
                            <input type="date" value={birthdate} oninput={handleBirthdateChange}/>
                            <small class="field-hint">You must be 18 or over to register.</small>
                        </div>

                        <div class="field-block">
                            <label>Phone Number</label>
                            <input type="tel" value={phoneNumber} oninput={handlePhoneNumberChange} placeholder="0400 000 000"/>
                        </div>

                        <div class="field-block">
                            <label>Password</label>
                            <input type="password" value={registerPassword} oninput={handleRegisterPasswordChange}/>
                            <small class="field-hint">At least 8 characters.</small>
                        </div>

                        <div class="field-block">
                            <label>Confirm Password</label>
                            <input type="password" value={registerPasswordConfirm} oninput={handleRegisterPasswordConfirmChange}/>
                        </div>

                        <button class="primary-btn" onclick={handleRegister} disabled={isLoading}>
                            <template if:true={isLoading}>Creating...</template>
                            <template if:false={isLoading}>Create Account</template>
                        </button>

                        <div class="switch-text">
                            Already have an account?
                            <button type="button" class="inline-link" onclick={showSignIn}>Sign in</button>
                        </div>
                    </div>
                </template>

                <template if:true={registrationComplete}>
                    <div class="form-section confirmation">
                        <h2>Account created</h2>
                        <p>
                            Your account is ready. Sign in with your email and the password you just chose.
                        </p>
                        <button type="button" class="inline-link" onclick={showSignIn}>Go to sign in</button>
                    </div>
                </template>
            </template>
        </div>
    </div>
</template>
